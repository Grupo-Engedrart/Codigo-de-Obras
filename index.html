<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Obras</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2D3748">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Consulta Obras">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <style>
        .font-inter { font-family: 'Inter', sans-serif; }
        .search-input { font-size: 18px; }
        .obra-card { transition: all 0.2s ease; }
        .obra-card:active { transform: scale(0.98); }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-inter">
    
    <!-- Header -->
    <header class="bg-gray-800 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="flex items-center justify-between">
            <h1 class="text-xl font-bold">Consulta de Obras</h1>
            <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                🔄 Atualizar
            </button>
        </div>
    </header>

    <!-- Search Section -->
    <section class="p-4 bg-white shadow-sm">
        <div class="relative">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Buscar por código, empresa, AF ou descrição..."
                class="w-full px-4 py-3 border border-gray-300 rounded-lg search-input focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
            <button id="clearSearch" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
                ✕
            </button>
        </div>
    </section>

    <!-- Status Bar -->
    <div id="statusBar" class="px-4 py-2 bg-blue-50 text-blue-800 text-sm hidden">
        <div class="flex items-center justify-between">
            <span id="statusText">Atualizando dados...</span>
            <span id="lastUpdate">--</span>
        </div>
    </div>

    <!-- Main Content -->
    <main class="p-4">
        <!-- Loading State -->
        <div id="loadingState" class="space-y-4">
            <div class="skeleton bg-gray-200 h-24 rounded-lg"></div>
            <div class="skeleton bg-gray-200 h-24 rounded-lg"></div>
            <div class="skeleton bg-gray-200 h-24 rounded-lg"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 hidden">
            <div class="text-gray-400 text-6xl mb-4">🏗️</div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Nenhuma obra encontrada</h3>
            <p class="text-gray-500">Tente ajustar sua busca ou atualizar os dados</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="text-center py-12 hidden">
            <div class="text-red-400 text-6xl mb-4">⚠️</div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Erro ao carregar dados</h3>
            <p class="text-gray-500 mb-4">Verifique sua conexão e tente novamente</p>
            <button id="retryBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                Tentar Novamente
            </button>
        </div>

        <!-- Obras List -->
        <div id="obrasList" class="space-y-3 hidden"></div>
    </main>

    <!-- Detalhes Modal -->
    <div id="detalhesModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-md w-full max-h-screen overflow-y-auto">
                <div class="p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900">Detalhes da Obra</h2>
                        <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">×</button>
                    </div>
                    
                    <div id="detalhesContent" class="space-y-4">
                        <!-- Content will be populated by JavaScript -->
                    </div>
                    
                    <div class="mt-6 pt-4 border-t">
                        <button id="backToList" class="w-full bg-gray-800 text-white py-3 rounded-lg font-medium hover:bg-gray-700 transition-colors">
                            Voltar para Lista
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Offline Indicator -->
    <div id="offlineIndicator" class="fixed bottom-4 left-4 right-4 bg-yellow-500 text-white p-3 rounded-lg shadow-lg hidden">
        <div class="flex items-center">
            <span class="mr-2">📶</span>
            <span>Modo offline - dados podem estar desatualizados</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
